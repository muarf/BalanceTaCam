name: Build Ultra Simple

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 33
        build-tools: 33.0.2
        
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Debug environment
      run: |
        echo "=== JAVA VERSION ==="
        java -version
        echo "=== ANDROID SDK ==="
        echo "ANDROID_HOME: $ANDROID_HOME"
        echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
        ls -la $ANDROID_HOME || echo "ANDROID_HOME not found"
        ls -la $ANDROID_SDK_ROOT || echo "ANDROID_SDK_ROOT not found"
        echo "=== GRADLE VERSION ==="
        ./gradlew --version
        echo "=== GRADLE PROPERTIES ==="
        cat gradle.properties || echo "No gradle.properties"
        echo "=== BUILD.GRADLE.KTS ==="
        head -20 app/build.gradle.kts
        
    - name: Clean project
      run: ./gradlew clean
      
    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace --info --no-daemon
      env:
        ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
        ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-ultra-simple
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30