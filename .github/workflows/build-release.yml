name: Build Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build Release APK
      run: ./gradlew assembleRelease
      
    - name: Upload Release APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release-${{ github.ref_name }}
        path: app/build/outputs/apk/release/app-release.apk
        retention-days: 90
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}
        name: Release ${{ github.ref_name }}
        body: |
          ## 🎉 Release ${{ github.ref_name }}
          
          **Version:** ${{ github.ref_name }}
          **Commit:** ${{ github.sha }}
          
          ### 🚀 Téléchargement
          Téléchargez l'APK de production ci-dessous.
          
          ### 📋 Changelog
          Consultez les commits pour voir les modifications apportées.
          
          ### 🔍 Installation
          1. Téléchargez le fichier APK
          2. Sur votre téléphone, activez "Sources inconnues"
          3. Installez l'APK
          4. Profitez de l'application !
        files: app/build/outputs/apk/release/app-release.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}