name: Android CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
  release:
    types: [created]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run tests
      run: ./gradlew test --stacktrace

    - name: Build debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload debug APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk

  lint:
    name: Lint Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run lint
      run: ./gradlew lintDebug --stacktrace

    - name: Upload lint results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: lint-results
        path: app/build/reports/lint-results-debug.html

  release:
    name: Create Release
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: [build, lint]
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode keystore
      env:
        KEYSTORE_B64: ${{ secrets.KEYSTORE_FILE }}
      run: |
        mkdir -p keystore
        CLEAN=$(printf '%s' "$KEYSTORE_B64" | tr -d '\r\n "')
        if printf '%s' "$CLEAN" | base64 -d -i > keystore/balancetacam.keystore 2>/dev/null; then
          echo "Decodage base64 OK"
        else
          echo "::warning::Le secret KEYSTORE_FILE n'est pas du base64 valide, tentative en tant que binaire brut"
          printf '%s' "$KEYSTORE_B64" > keystore/balancetacam.keystore
        fi
        ls -la keystore/
        if ! keytool -list -keystore keystore/balancetacam.keystore -storepass "${{ secrets.KEYSTORE_PASSWORD }}" >/dev/null 2>&1; then
          echo "::error::Keystore invalide. Regenerer le secret avec: base64 -w0 balancetacam.keystore"
          exit 1
        fi
        echo "Keystore valide"

    - name: Build release APK
      run: ./gradlew assembleRelease --stacktrace
      env:
        KEYSTORE_FILE: keystore/balancetacam.keystore
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    - name: Rename APK
      run: mv app/build/outputs/apk/release/app-release.apk BalanceTaCam-${{ github.ref_name }}.apk

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: BalanceTaCam-${{ github.ref_name }}.apk

    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        files: BalanceTaCam-${{ github.ref_name }}.apk


