name: Build APK Simple

on:
  push:
    branches: [ feature/*, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 33
        build-tools: 33.0.2
        
    - name: Cache Gradle packages
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
      
    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace
      env:
        ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
        ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-${{ github.ref_name }}
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30
        
    - name: Create Release
      if: startsWith(github.ref, 'refs/heads/feature/')
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.ref_name }}-build
        name: ${{ github.ref_name }} - APK Build
        body: |
          ## 📱 APK Build - ${{ github.ref_name }}
          
          **Commit:** ${{ github.sha }}
          **Branch:** ${{ github.ref_name }}
          
          ### 🚀 Téléchargement
          Téléchargez l'APK ci-dessous et installez-le sur votre appareil Android.
          
          ### 📋 Instructions d'installation
          1. Téléchargez le fichier APK
          2. Sur votre téléphone, activez "Sources inconnues"
          3. Installez l'APK téléchargé
          4. Lancez l'application
          
          ### 🔍 Fonctionnalités incluses
          - Icônes de caméras stylisées
          - Distinction visuelle par type de surveillance
          - Interface améliorée
        files: app/build/outputs/apk/debug/app-debug.apk
        draft: false
        prerelease: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}